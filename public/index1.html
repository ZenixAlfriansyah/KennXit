function slide(){const h=$('#hs');if(!h)return;const s=[...h.querySelectorAll('.sl')],d=[...h.querySelectorAll('i')];let i=0,x0=0;
const pos=(e,x,t)=>{e.style.transition=t?'transform .7s cubic-bezier(.4,0,.2,1)':'none';e.style.transform='translateX('+x+'%)'};
const to=(n,dir)=>{n=(n+s.length)%s.length;if(n==i)return;dir=dir||(n>i?1:-1);const a=s[i],b=s[n];pos(b,dir*100);b.offsetWidth;pos(a,-dir*100,1);pos(b,0,1);i=n;d.forEach((e,k)=>e.classList.toggle('on',k==i))};
d.forEach((e,k)=>e.onclick=()=>{to(k);auto()});const a=h.querySelector('.sa.l'),z=h.querySelector('.sa.r');a&&(a.onclick=()=>{to(i-1,-1);auto()});z&&(z.onclick=()=>{to(i+1,1);auto()});
h.ontouchstart=e=>x0=e.touches[0].clientX;h.ontouchend=e=>{const dx=e.changedTouches[0].clientX-x0;if(Math.abs(dx)>40){to(i+(dx<0?1:-1),dx<0?1:-1);auto()}};
