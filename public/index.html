<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0f1226"><title>KENXIT STORE</title><link rel="icon" id="fav" href="data:,">
<style>
:root{--bg:#0f1226;--s:#181c36;--s2:#21264a;--t:#eef0ff;--m:#9aa0cc;--a:#7c5cff;--a2:#7ea0ff;--p:#ffb547;--r:#ff5c7a;--b:#2a2f5a;--rad:14px}
*{box-sizing:border-box;margin:0}html{-webkit-text-size-adjust:100%}
body{font:15px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--t);overflow-x:hidden;min-height:100vh}
a{color:inherit;text-decoration:none}img{max-width:100%;display:block}h1,h2,h3{line-height:1.25}h2{font-size:20px}h3{font-size:16px;margin:18px 0 8px}
.w{max-width:1120px;margin:auto;padding:0 16px}.c{text-align:center;margin:20px 0}.m{color:var(--m)}

.nav{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px 14px;align-items:center;padding-top:10px;padding-bottom:10px}
.logo{display:flex;align-items:center;gap:8px;font-weight:800;font-size:17px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.logo img{height:28px;width:auto}
.nav nav{display:flex;gap:14px;font-size:14px}.nav nav a{color:var(--m);padding:6px 0}.nav nav a:hover{color:var(--t)}
.sf{grid-column:1/-1;grid-row:2}.sf input{margin:0;border-radius:999px;padding-left:16px}
@media(min-width:760px){.nav{grid-template-columns:auto minmax(0,1fr) auto;gap:20px}.sf{grid-column:2;grid-row:1;max-width:460px;justify-self:center;width:100%}.nav nav{gap:22px;font-size:15px}}
input,select,textarea,button{font:inherit;color:inherit}
input,select,textarea{width:100%;font-size:16px;background:var(--s);border:1px solid var(--b);border-radius:10px;padding:11px 14px;margin-top:4px;outline:none;transition:border-color .15s}
input:focus,select:focus,textarea:focus{border-color:var(--a)}input[type=file]{padding:8px;font-size:14px}
.btn{background:var(--a);color:#fff;border:0;border-radius:10px;padding:11px 18px;min-height:44px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;text-align:center;transition:filter .15s}.btn:hover{filter:brightness(1.12)}
.btn.o{background:var(--s2);color:var(--t)}.btn.d{background:var(--r)}.btn:disabled{opacity:.4;cursor:not-allowed;filter:none}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media(min-width:640px){.grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}}@media(min-width:960px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
.card{background:var(--s);border:1px solid var(--b);border-radius:var(--rad);overflow:hidden;display:flex;flex-direction:column;transition:transform .2s,border-color .2s}
@media(hover:hover){.card:hover{border-color:var(--a);transform:translateY(-2px)}}

.chip{flex:none;background:var(--s);border:1px solid var(--b);border-radius:999px;padding:7px 15px;white-space:nowrap;display:inline-flex;gap:6px;align-items:center;font-size:14px}.chip.on{background:var(--a);border-color:var(--a);color:#fff}.chip img{height:18px;width:auto}
.hero{position:relative;aspect-ratio:16/9;border-radius:18px;overflow:hidden;margin-top:16px;background:var(--s)}@media(min-width:760px){.hero{aspect-ratio:21/8}}
.hb{aspect-ratio:auto;min-height:210px;display:flex;align-items:center;padding:28px 22px;background:radial-gradient(120% 140% at 100% 0,#4b34c9 0,transparent 55%),linear-gradient(135deg,#1c1f45,#12142b)}
.hb h1{font-size:clamp(26px,6vw,44px)}.hb p{margin:10px 0 18px;color:#c4c8ee;max-width:480px}
.sl{position:absolute;inset:0;opacity:0;transition:opacity .5s;pointer-events:none;display:block}.sl.on{opacity:1;pointer-events:auto}.sl img{width:100%;height:100%;object-fit:cover}
.ov{position:absolute;left:0;right:0;bottom:0;padding:44px 18px 30px;background:linear-gradient(transparent,rgba(15,18,38,.92))}.ov h2{font-size:clamp(17px,4vw,26px)}.ov p{font-size:13px;color:#d5d8f5}

.pd{display:grid;gap:20px;margin-top:20px;align-items:start}@media(min-width:800px){.pd{grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:32px}}
.pd>img,.pd>.ph{border-radius:18px;aspect-ratio:1;object-fit:cover;width:100%;max-height:520px}.pd h1{font-size:clamp(24px,5vw,32px);margin-bottom:8px}
.v{background:var(--s);color:var(--t);border:2px solid var(--b);border-radius:12px;padding:12px;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:2px;transition:.15s;min-width:0}.v span{color:var(--p);font-weight:700}.v small{color:var(--m)}
.v.on{border-color:var(--a);background:var(--s2);box-shadow:0 0 0 3px rgba(124,92,255,.3)}.v:disabled{opacity:.35;cursor:not-allowed}
.sum{background:var(--s);border:1px dashed var(--b);border-radius:12px;padding:12px 14px;margin:14px 0;color:var(--m)}.sum.on{border-style:solid;border-color:var(--a);color:var(--t)}
#buy{width:100%;min-height:52px;font-size:16px}
footer{margin-top:44px;border-top:1px solid var(--b);padding:22px 0 calc(22px + env(safe-area-inset-bottom));color:var(--m);text-align:center;font-size:14px}footer a{color:var(--t);margin:0 8px}
.adm{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:100vh}.adm aside{background:var(--s);padding:16px;display:flex;flex-direction:column;gap:4px;border-right:1px solid var(--b);position:sticky;top:0;height:100vh;overflow-y:auto}
.adm aside a{padding:10px 12px;border-radius:8px;color:var(--m)}.adm aside a.on,.adm aside a:hover{background:var(--s2);color:var(--t)}.adm section{padding:16px 20px 48px;min-width:0}
@media(max-width:760px){.adm{grid-template-columns:minmax(0,1fr)}.adm aside{flex-direction:row;overflow-x:auto;overflow-y:hidden;height:auto;border:0;border-bottom:1px solid var(--b);z-index:10;padding:10px;scrollbar-width:none}.adm aside a{white-space:nowrap;flex:none}.adm section{padding:12px 14px 48px}}
.box{background:var(--s);border:1px solid var(--b);border-radius:var(--rad);padding:16px;margin:12px 0;display:grid;gap:12px;max-width:720px;width:100%}label{display:block;color:var(--m);font-size:13px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--s);border:1px solid var(--b);border-radius:12px;padding:10px 14px;margin:8px 0;flex-wrap:wrap}.row>span:first-child{min-width:0;overflow-wrap:anywhere}.row>span:last-child{display:flex;gap:8px;flex-wrap:wrap}
.vr{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}.vr button{grid-column:1/-1;min-height:40px}@media(min-width:760px){.vr{grid-template-columns:1fr 1fr 1fr 120px 44px}.vr button{grid-column:auto;padding:0}}
.big{font-size:28px}.pv{height:70px;width:auto;border-radius:8px;margin:6px 0}.lg{min-height:100vh;display:grid;place-items:center;padding:16px}.lg .box{max-width:380px}.pw{display:flex;gap:6px}.pw input{margin-top:4px}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body><div id="app"></div><script>
const $=s=>document.querySelector(s),app=$('#app');let S={},sel=null,P=null,T;
const api=async(u,o={})=>{const r=await fetch(u,{credentials:'same-origin',...o,headers:typeof o.body=='string'?{'content-type':'application/json'}:{}});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Terjadi kesalahan');return d};
const rp=n=>Number(n).toLocaleString('id-ID'),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const go=u=>{history.pushState({},'',u);return route()};onpopstate=()=>route();
document.addEventListener('click',e=>{const a=e.target.closest('a[data-l]');if(a){e.preventDefault();go(a.getAttribute('href'))}});
const main=h=>$('#m').innerHTML=h;
async function route(){const p=location.pathname.replace(/\/$/,'')||'/';scrollTo(0,0);clearInterval(T);
try{if(p.startsWith('/kenxitadmin'))return await admin(p);
if(!S.site_name){S=await api('/api/settings');document.title=S.site_name;if(S.favicon_url)$('#fav').href=S.favicon_url}
shell();let m;if(p==='/')return home();if(p==='/catalog')return catalog();
if(m=p.match(/^\/product\/([\w-]+)$/))return product(m[1]);if(m=p.match(/^\/category\/([\w-]+)$/))return catalog(m[1]);
main('<p class=c>Halaman tidak ditemukan.</p>')}catch(e){app.innerHTML='<p class=c>'+esc(e.message)+'</p>'}}
function shell(){app.innerHTML=`<header><div class="w nav"><a data-l href="/" class=logo>${S.logo_url?`<img src="${esc(S.logo_url)}" alt="">`:''}${esc(S.site_name)}</a><form class=sf onsubmit="return sq(this)"><input name=q type=search placeholder="Cari produk…" aria-label="Cari produk"></form><nav><a data-l href="/">Beranda</a><a data-l href="/catalog">Katalog</a><a href="https://wa.me/${esc(S.whatsapp_number)}" target=_blank rel=noopener>Bantuan</a></nav></div></header><main id=m class=w></main><footer><div class=w>${S.instagram?`<a href="${esc(S.instagram)}" target=_blank rel=noopener>Instagram</a>`:''}${S.tiktok?`<a href="${esc(S.tiktok)}" target=_blank rel=noopener>TikTok</a>`:''}<p>${esc(S.contact_info)}</p><p>${esc(S.footer_text)}</p></div></footer>`}
window.sq=f=>{go('/catalog?q='+encodeURIComponent(f.q.value));return false};
const card=p=>`<a data-l href="/product/${esc(p.slug)}" class=card>${p.image_url?`<img loading=lazy src="${esc(p.image_url)}" alt="${esc(p.name)}">`:`<div class=ph>${esc((p.name||'?')[0])}</div>`}<div class=cb><b>${esc(p.name)}</b><small>${esc(p.game||'')}</small><span class=pr>${p.min_price!=null?'Mulai Rp'+rp(p.min_price):'Stok habis'}</span><small>${p.total_sold} terjual</small><span class="btn o">Lihat</span></div></a>`;
function list(q){let pg=0;const g=$('#g'),mb=$('#more');const load=async()=>{const d=await api('/api/products?'+q+'&page='+pg++);g.insertAdjacentHTML('beforeend',d.items.map(card).join('')||(pg==1?'<div class=empty>Belum ada produk yang cocok.</div>':''));mb.hidden=!d.more};mb.onclick=load;load().catch(e=>g.textContent=e.message)}
const grid='<div id=g class=grid></div><div class=c><button id=more class="btn o" hidden>Muat lebih banyak</button></div>';
async function home(){const d=await api('/api/home'),b=d.banners;
main((b.length?`<div class=hero id=hs>${b.map((x,i)=>`<a class="sl ${i?'':'on'}" ${/^(https?:\/\/|\/)/.test(x.target_url||'')?`href="${esc(x.target_url)}"`:''}><img src="${esc(x.image_url)}" alt="" onerror="this.remove()">${x.title?`<div class=ov><h2>${esc(x.title)}</h2><p>${esc(x.description)}</p></div>`:''}</a>`).join('')}${b.length>1?`<div class=dots>${b.map((_,i)=>`<i class="${i?'':'on'}"></i>`).join('')}</div>`:''}</div>`:`<div class="hero hb"><div><h1>${esc(S.site_name)}</h1><p>${esc(S.site_description)}</p><a data-l class=btn href="/catalog">Lihat Katalog</a></div></div>`)+
(d.categories.length?`<div class=sec><h2>Kategori</h2></div><div class=chips>${d.categories.map(c=>`<a data-l class=chip href="/category/${esc(c.slug)}">${c.icon_url?`<img src="${esc(c.icon_url)}" alt="">`:''}${esc(c.name)}</a>`).join('')}</div>`:'')+`<div class=sec><h2>Produk Terbaru</h2><a data-l href="/catalog">Lihat semua</a></div>${grid}`);list('');slide()}
function slide(){const h=$('#hs');if(!h)return;const s=[...h.querySelectorAll('.sl')],d=[...h.querySelectorAll('i')];let i=0,x0=0;
const to=n=>{i=(n+s.length)%s.length;s.forEach((e,k)=>e.classList.toggle('on',k==i));d.forEach((e,k)=>e.classList.toggle('on',k==i))};
d.forEach((e,k)=>e.onclick=()=>to(k));h.ontouchstart=e=>x0=e.touches[0].clientX;h.ontouchend=e=>{const dx=e.changedTouches[0].clientX-x0;if(Math.abs(dx)>40)to(i+(dx<0?1:-1))};
if(s.length>1)T=setInterval(()=>to(i+1),5000)}
async function catalog(cat){const q=new URLSearchParams(location.search).get('q')||'',cs=(await api('/api/home')).categories;
main(`<h2>Katalog${q?': '+esc(q):''}</h2><div class=chips><a data-l class="chip ${cat?'':'on'}" href="/catalog">Semua</a>${cs.map(c=>`<a data-l class="chip ${c.slug==cat?'on':''}" href="/category/${esc(c.slug)}">${esc(c.name)}</a>`).join('')}</div><br>${grid}`);list('q='+encodeURIComponent(q)+(cat?'&category='+encodeURIComponent(cat):''))}
async function product(slug){P=await api('/api/products/'+slug);sel=null;document.title=P.name+' – '+S.site_name;
main(`<div class=pd>${P.image_url?`<img src="${esc(P.image_url)}" alt="${esc(P.name)}">`:'<div class=ph></div>'}<div><h1>${esc(P.name)}</h1><span class=chip>${esc(P.game||'')}</span><p class=m style="margin-top:12px;white-space:pre-line;overflow-wrap:anywhere">${esc(P.description)}</p><h3>Pilih salah satu varian yang tersedia:</h3><div class=g2>${P.variants.map((v,i)=>`<button class=v data-i=${i} ${v.status?'':'disabled'}><b>${esc(v.duration)}</b>${v.name&&v.name!=v.duration?`<small>${esc(v.name)}</small>`:''}<span>${v.status?'Rp'+rp(v.price):'Habis'}</span></button>`).join('')}</div><div id=sum class=sum>Silakan pilih varian terlebih dahulu</div><button id=buy class=btn disabled>Beli Sekarang</button></div></div>`);
document.querySelectorAll('.v').forEach(b=>b.onclick=()=>{sel=P.variants[b.dataset.i];document.querySelectorAll('.v').forEach(x=>x.classList.toggle('on',x===b));
const s=$('#sum');s.classList.add('on');s.innerHTML=`<small class=m>Pilihan aktif</small><br>Jenis: <b>${esc(sel.duration)}</b><br>Harga: <b class=pr>Rp${rp(sel.price)}</b>`;$('#buy').disabled=false});
$('#buy').onclick=()=>{if(!sel)return;const t=(S.wa_template||'').split('{product}').join(P.name).split('{game}').join(P.game||'').split('{duration}').join(sel.duration).split('{price}').join(rp(sel.price));
const url=`https://wa.me/${S.whatsapp_number}?text=${encodeURIComponent(t)}`;if(!window.open(url,'_blank'))location.href=url}}
/* ---------- ADMIN ---------- */
const SF=[['site_name','Nama Website'],['store_name','Nama Store'],['site_description','Deskripsi Website','area'],['whatsapp_number','Nomor WhatsApp (628…)'],['wa_template','Template Pesan WA ({product} {game} {duration} {price})','area'],['footer_text','Teks Footer'],['instagram','Link Instagram'],['tiktok','Link TikTok'],['contact_info','Informasi Kontak','area'],['logo_url','Logo','img'],['favicon_url','Favicon','img']].map(a=>({k:a[0],l:a[1],t:a[2]}));
const C={banners:['Manajemen Banner',[{k:'title',l:'Judul'},{k:'description',l:'Deskripsi singkat'},{k:'image_url',l:'Gambar',t:'img'},{k:'target_url',l:'Link tujuan (opsional)'},{k:'display_order',l:'Urutan',t:'number'},{k:'status',l:'Status',t:'status'}]],categories:['Kategori Game',[{k:'name',l:'Nama'},{k:'slug',l:'Slug (otomatis jika kosong)'},{k:'icon_url',l:'Ikon / gambar',t:'img'},{k:'status',l:'Status',t:'status'}]]};
const fh=(f,v)=>f.map(x=>`<label>${x.l}${x.t=='area'?`<textarea name="${x.k}" rows=5>${esc(v[x.k])}</textarea>`:x.t=='img'?`<br><input name="${x.k}" placeholder="Tempel link gambar (https://… atau /images/nama.jpg)" value="${esc(v[x.k])}" oninput="const m=this.nextElementSibling;m.src=this.value;m.style.display=''"><img class=pv src="${esc(v[x.k])}" alt="" onerror="this.style.display='none'"><input type=file accept="image/jpeg,image/png,image/webp" onchange="up(this)">`:x.t=='status'?`<select name="${x.k}"><option value=1>Aktif<option value=0 ${v[x.k]===0?'selected':''}>Nonaktif</select>`:`<input name="${x.k}" type="${x.t||'text'}" value="${esc(v[x.k])}">`}</label>`).join('');
const rd=el=>Object.fromEntries([...el.querySelectorAll('[name]')].filter(i=>!i.closest('.vr')).map(i=>[i.name,i.value]));
window.up=async i=>{const f=i.files[0];if(!f)return;const fd=new FormData();fd.append('file',f);try{const d=await api('/api/admin/upload',{method:'POST',body:fd}),l=i.parentElement;l.querySelector('input[name]').value=d.url;const im=l.querySelector('img');im.src=d.url;im.style.display=''}catch(e){alert(e.message)}};

function login(){app.innerHTML=`<div class=lg><div class=box><h2 style="margin:0">KENXIT Admin</h2><label>Email<input id=em type=email autocomplete=username></label><label>Password<div class=pw><input id=pw type=password autocomplete=current-password onkeydown="event.key=='Enter'&&dl()"><button class="btn o" onclick=tp()>Lihat</button></div></label><button class=btn onclick=dl()>Login</button></div></div>`}
window.sv=async(r,id)=>{try{await api('/api/admin/'+r+(id?'/'+id:''),{method:id?'PUT':'POST',body:JSON.stringify(rd($('#f')))});route()}catch(e){alert(e.message)}};

if(pg=='account')return M(`<h2>Pengaturan Akun</h2><div id=f class=box><label>Password saat ini<input name=current type=password></label><label>Password baru (min. 8 karakter)<input name=new type=password></label><button class=btn onclick=pw()>Ganti Password</button></div>`);
